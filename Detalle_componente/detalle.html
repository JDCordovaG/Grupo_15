<!DOCTYPE html>
<html lang="es">
<head>

    <title>Detalle de Componente - BuildMyPC</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><h2>BuildMyPC</h2></div>
            <ul>
                <li><a href="../inicio/index.html">Inicio</a></li>

                <li><a href="../Armador_build/armador.html">Armador</a></li>

    <footer>
